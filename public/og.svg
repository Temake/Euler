<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="bigShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="0" flood-color="#5b21b6" flood-opacity="1"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#e5e5e5" flood-opacity="1"/>
    </filter>
  </defs>
  <!-- Background canvas -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <!-- Decorative curve at the bottom -->
  <path d="M 0 540 Q 300 480 600 520 T 1200 490 L 1200 630 L 0 630 Z" fill="#f3e8ff"/>
  
  <!-- Left Side: Sigma Emblem -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="280" height="280" rx="64" fill="#7c3aed" filter="url(#bigShadow)"/>
    <rect x="20" y="20" width="240" height="90" rx="40" fill="#8b5cf6" opacity="0.4"/>
    <text x="140" y="195" font-family="'Nunito', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="190" fill="#ffffff" text-anchor="middle">∑</text>
  </g>

  <!-- Right Side: Content -->
  <g transform="translate(500, 150)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#f3e8ff"/>
    <text x="110" y="27" font-family="'Nunito', system-ui, sans-serif" font-weight="800" font-size="16" fill="#7c3aed" text-anchor="middle" letter-spacing="1px">EULER QUIZ ARENA</text>

    <!-- Main Headline -->
    <text x="0" y="110" font-family="'Nunito', system-ui, sans-serif" font-weight="900" font-size="56" fill="#100f3e" letter-spacing="-1px">
      Master the Quiz.
    </text>
    <text x="0" y="175" font-family="'Nunito', system-ui, sans-serif" font-weight="900" font-size="56" fill="#7c3aed" letter-spacing="-1px">
      Dominate the Board!
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" font-family="'Nunito', system-ui, sans-serif" font-weight="600" font-size="24" fill="#777777">
      The playful, gamified way to train for Cloud, Computing, &amp; Networks.
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="140" height="48" rx="14" fill="#ffffff" stroke="#e5e5e5" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="70" y="30" font-family="'Nunito', system-ui, sans-serif" font-weight="800" font-size="18" fill="#ff9600" text-anchor="middle">🔥 STREAKS</text>

      <rect x="160" y="0" width="140" height="48" rx="14" fill="#ffffff" stroke="#e5e5e5" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="230" y="30" font-family="'Nunito', system-ui, sans-serif" font-weight="800" font-size="18" fill="#1cb0f6" text-anchor="middle">💎 GEMS</text>

      <rect x="320" y="0" width="160" height="48" rx="14" fill="#ffffff" stroke="#e5e5e5" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="400" y="30" font-family="'Nunito', system-ui, sans-serif" font-weight="800" font-size="18" fill="#7c3aed" text-anchor="middle">🏆 LEAGUES</text>
    </g>
  </g>
</svg>
